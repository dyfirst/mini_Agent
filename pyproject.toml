[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "my-agent"
version = "0.1.0"
description = "Custom AI Agent with Agent Loop"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "click>=8.0",
    "httpx>=0.24.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "openai>=1.0",
]

[project.optional-dependencies]
providers = [
    "anthropic>=0.18.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
agent = "agent.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
